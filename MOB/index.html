<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E7EDFC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SCORE">
  <title>SCORE PLAY</title>
  <link rel="icon" type="image/png" href="./icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="./icons/app-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css?v=20260807-preloader">
</head>
<body>
  <div id="app-loader" class="app-loader" role="status" aria-live="polite" aria-label="Загрузка SCORE">
    <div class="app-loader-logo" aria-hidden="true">
      <span class="app-loader-letter">S</span>
      <span class="app-loader-letter">C</span>
      <span class="app-loader-object">
        <img class="is-active" src="../assets/logo-objects/object-1.svg" alt="">
        <img src="../assets/logo-objects/object-2.svg" alt="">
        <img src="../assets/logo-objects/object-3.svg" alt="">
        <img src="../assets/logo-objects/object-4.svg" alt="">
        <img src="../assets/logo-objects/object-5.svg" alt="">
      </span>
      <span class="app-loader-letter">R</span>
      <span class="app-loader-letter">E</span>
    </div>
    <div class="app-loader-bar" aria-hidden="true"><span></span></div>
  </div>

  <div id="app" class="app-shell">
    <section id="login-screen" class="login-screen" aria-label="Вход SCORE PLAY">
      <div class="login-brand" aria-hidden="true">SCORE</div>
      <div class="login-card">
        <p class="login-kicker">mobile web</p>
        <h1>Вход в SCORE PLAY</h1>
        <p>Используйте тестовый доступ для мобильной версии в Telegram.</p>
        <form id="login-form" class="login-form" autocomplete="off">
          <label>Логин
            <input id="login-input" type="text" value="SCORE" required>
          </label>
          <label>Пароль
            <input id="password-input" type="password" value="SCORE123" required>
          </label>
          <p id="login-error" class="login-error" aria-live="polite"></p>
          <button class="primary-pill" type="submit">Войти</button>
        </form>
      </div>
    </section>

    <main id="mobile-app" class="mobile-app" hidden>
      <header class="app-header">
        <div class="header-brand">
          <strong>SCORE</strong>
          <span id="screen-title">Главная</span>
        </div>
        <div class="header-actions">
          <button id="notifications-shortcut" class="icon-shortcut" type="button" data-action="open-notifications" aria-label="Уведомления">
            <img src="./icons/notifications.png" alt="" aria-hidden="true">
            <i></i>
          </button>
        </div>
      </header>

      <section id="screen-home" class="app-screen is-active" data-screen="home" aria-label="Главная"></section>
      <section id="screen-venues" class="app-screen" data-screen="venues" aria-label="Площадки"></section>
      <section id="screen-games" class="app-screen" data-screen="games" aria-label="Игры"></section>
      <section id="screen-progress" class="app-screen" data-screen="progress" aria-label="Прогресс"></section>
      <section id="screen-team" class="app-screen" data-screen="team" aria-label="Команда"></section>
      <section id="screen-profile" class="app-screen" data-screen="profile" aria-label="Профиль"></section>

      <button id="floating-create-game" class="floating-create-game" type="button" data-action="create-game" aria-label="Создать игру" hidden>
        <span aria-hidden="true">+</span>
        <strong>Создать игру</strong>
      </button>

      <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="is-active" type="button" data-nav="home" aria-label="Главная"><span aria-hidden="true"><img src="./icons/home.png" alt=""></span><strong>Главная</strong></button>
        <button type="button" data-nav="venues" aria-label="Площадки"><span aria-hidden="true"><img src="./icons/venues.png" alt=""></span><strong>Площадки</strong></button>
        <button type="button" data-nav="games" aria-label="Игры"><span aria-hidden="true"><img src="./icons/games.png" alt=""></span><strong>Игры</strong></button>
        <button type="button" data-nav="profile" aria-label="Профиль"><span aria-hidden="true"><img src="./icons/profile.png" alt=""></span><strong>Профиль</strong></button>
      </nav>
    </main>

    <div id="sheet" class="sheet" hidden aria-hidden="true">
      <button class="sheet-backdrop" type="button" data-close-sheet aria-label="Закрыть"></button>
      <section class="sheet-panel" role="dialog" aria-modal="true">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="sheet-content" class="sheet-content"></div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="./app.classic.js?v=20260807-preloader"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var form = document.querySelector('#login-form');
      if (!form || form.dataset.fallbackBound === 'true') return;
      form.dataset.fallbackBound = 'true';
      form.addEventListener('submit', function (event) {
        var login = document.querySelector('#login-input');
        var password = document.querySelector('#password-input');
        var error = document.querySelector('#login-error');
        var app = document.querySelector('#mobile-app');
        var loginScreen = document.querySelector('#login-screen');
        var home = document.querySelector('#screen-home');
        var title = document.querySelector('#screen-title');
        if (!login || !password || !app || !loginScreen) return;
        if (String(login.value).trim().toUpperCase() === 'SCORE' && String(password.value).trim() === 'SCORE123') {
          event.preventDefault();
          loginScreen.hidden = true;
          app.hidden = false;
          try {
            var saved = JSON.parse(localStorage.getItem('scoreplay_mob_state') || '{}');
            saved.authorized = true;
            saved.activeScreen = 'home';
            localStorage.setItem('scoreplay_mob_state', JSON.stringify(saved));
          } catch (_) {
            localStorage.setItem('scoreplay_mob_state', JSON.stringify({ authorized: true, activeScreen: 'home' }));
          }
          if (title) title.textContent = 'Главная';
          if (home && !home.innerHTML.trim()) {
            home.innerHTML = '<div class="screen-stack"><article class="hero-card"><div class="hero-copy"><h2>Двигаемся сегодня</h2><p>Играть чаще · Любитель · Москва</p></div><div class="hero-goal"><span>Цель дня</span><strong>10 000</strong><div class="progress-block"><div class="progress-meta"><span>Прогресс</span><strong>6800 / 10000</strong></div><div class="progress-rail"><span style="width:68%"></span></div></div></div></article><section class="section-card"><div class="section-header"><h2>Приложение загружено</h2></div><p>Если основной интерфейс не появился после перезагрузки, сообщите об этом.</p></section></div>';
          }
          return;
        }
        if (error) error.textContent = 'Неверный логин или пароль';
      });
    });
  </script>
</body>
</html>
